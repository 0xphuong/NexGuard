# L7 ZTNA — opt-in L7 proxy daemon overlay (ADR-007, L7-D).
#
# Activate alongside the main prod compose:
#
#   docker compose -f docker-compose.prod.yml \
#                  -f docker-compose.coredns.yml \
#                  -f docker-compose.proxy.yml up -d
#
# Brings up the custom Go transparent proxy binary that consumes:
#   * /internal/bundle.json  (cert_pem + key_pem + signing_key + rules)
#   * /internal/sessions/by_vpn_ip/:ip  (per-VPN-IP identity payload)
#   * /.well-known/jwks.json (public — JWT verifiers; the proxy itself
#                             holds the private half from the bundle)
#
# DEPLOYMENT CAVEATS — read once before flipping `l7_enabled`:
#
#   * `network_mode: host` is REQUIRED. The proxy receives packets
#     redirected by the fz_wall TPROXY chain (L7-C). Userspace must
#     be in the host's net namespace for the IP_TRANSPARENT socket
#     to see those packets — there's no Docker bridge plumbing that
#     accomplishes this without reimplementing TPROXY in user space.
#
#   * NET_ADMIN capability is REQUIRED. The IP_TRANSPARENT setsockopt
#     fails with EPERM otherwise. The image runs as a non-root user
#     by default; the capability grant lets it bind anyway.
#
#   * The proxy reaches the NexGuard server via its PUBLIC DNS
#     (e.g. https://nexguard.example.com). Set NEXGUARD_SERVER_URL
#     to match your portal hostname. Under the hood this traverses
#     Caddy at :443, then Phoenix at :13000 — same path a browser
#     uses, so no firewall surgery required.

version: '3.7'

services:
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    # image: binhphuong/nexguard-proxy:${PROXY_VERSION:-latest}  # uncomment once we publish
    environment:
      # Caddy listens at :13443 on the HOST net namespace. From inside
      # the nexguard container (which this proxy shares network with
      # via network_mode below), the host is reachable as the Docker
      # bridge gateway IP — 172.25.0.1 for the default nexguard-network
      # subnet 172.25.0.0/16. The L7 cert generated by
      # scripts/l7-rotate-proxy-cert.sh includes IP:172.25.0.1 in its
      # SAN list, so TLS validates cleanly.
      #
      # We can't use extra_hosts (Docker rejects it together with
      # network_mode: service) so we go via the bridge IP directly.
      NEXGUARD_SERVER_URL: ${NEXGUARD_SERVER_URL:-https://172.25.0.1:13443}
      NEXGUARD_PROXY_LISTEN: 127.0.0.1:8443
      # Bind obs to 0.0.0.0 so the operator can reach /metrics +
      # /healthz at the nexguard container's bridge IP (172.25.0.100
      # by default) from the host. 127.0.0.1 would be reachable only
      # from inside the namespace.
      NEXGUARD_PROXY_OBS_LISTEN: 0.0.0.0:9090
      NEXGUARD_PROXY_LOG_LEVEL: ${NEXGUARD_PROXY_LOG_LEVEL:-info}
      # mTLS client material — see scripts/l7-rotate-proxy-cert.sh
      NEXGUARD_PROXY_CLIENT_CERT: /etc/nexguard/l7-certs/proxy.pem
      NEXGUARD_PROXY_CLIENT_KEY:  /etc/nexguard/l7-certs/proxy.key
      NEXGUARD_PROXY_CA_BUNDLE:   /etc/nexguard/l7-certs/internal-ca.pem
    volumes:
      - ${FZ_INSTALL_DIR:-.}/l7-certs:/etc/nexguard/l7-certs:ro
      # /etc/resolv.conf override — points proxy at the operator's
      # internal DNS so backend hostnames (e.g. `hq.example.com`
      # declared on the admin UI's Application.Backend) resolve to
      # internal IPs. Operator creates `l7-proxy-resolv.conf` next
      # to the compose file before running `up -d`, e.g.:
      #     nameserver 10.0.235.250   # internal DNS
      #     nameserver 1.1.1.1        # public fallback
      # NB: a `dns:` directive would be cleaner but Docker rejects
      # it together with `network_mode: service:`.
      - ${FZ_INSTALL_DIR:-.}/l7-proxy-resolv.conf:/etc/resolv.conf:ro
    # CRITICAL: join the nexguard container's network namespace, NOT
    # the host. The fz_wall TPROXY chain runs inside the nexguard
    # container; TPROXY divert only delivers to sockets in the SAME
    # net namespace as the netfilter chain. With network_mode: host
    # (the previous setting) the proxy listened on the host's lo,
    # while nft rules diverted in the container's lo — different
    # namespaces, packet dropped silently.
    network_mode: "service:nexguard"
    # The distroless image's `nonroot` user (uid 65532) can NOT use
    # cap_add'ed capabilities — Linux drops the effective cap set on
    # uid change. Run as uid 0 inside the container with the smallest
    # cap set that:
    #   * lets the IP_TRANSPARENT setsockopt succeed     (NET_ADMIN)
    #   * lets binding :8443 work without CAP_SYS_ADMIN  (NET_BIND_SERVICE)
    #   * reads the cert files (owned by uid 65532 / mode 640) without
    #     needing CAP_DAC_OVERRIDE                       (DAC_READ_SEARCH)
    # No chown / mknod / sys_admin / etc.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH
    healthcheck:
      # `--health-probe` is a built-in subcommand that hits /readyz
      # on the obs port and exits 0/1. Implemented inline because
      # distroless ships no curl/wget.
      test: ["CMD", "/usr/local/bin/nexguard-proxy", "--health-probe"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      nexguard:
        condition: service_started
    restart: unless-stopped
