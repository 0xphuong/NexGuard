# Example compose file for production deployment on Linux.
#
# Note: This file is meant to serve as a template. Please modify it
# according to your needs. Read more about Docker Compose:
#
# https://docs.docker.com/compose/compose-file/
#
#
x-deploy: &default-deploy
  restart_policy:
    condition: unless-stopped
    delay: 5s
    window: 120s
  update_config:
    order: start-first

version: '3.7'

services:
  caddy:
    image: caddy:2.11.3
    volumes:
      - ${FZ_INSTALL_DIR:-.}/caddy:/data/caddy
      # mTLS material rotated by scripts/l7-rotate-proxy-cert.sh.
      # The directory may be empty until L7 enforcement is rolled
      # out — Caddy still boots because the mTLS site at :13443 is
      # only loaded when both cert files exist.
      - ${FZ_INSTALL_DIR:-.}/l7-certs:/etc/nexguard/l7-certs:ro
    # See Caddy's documentation for customizing this line
    # https://caddyserver.com/docs/quick-starts/reverse-proxy
    command:
      - /bin/sh
      - -c
      - |
        # Public portal. /internal/* is HARD-BLOCKED here so an
        # external client can never reach the secret-bearing
        # control-plane endpoints regardless of mTLS state.
        cat <<EOF > /etc/caddy/Caddyfile
        ${EXTERNAL_URL} {
          log
          @internal path /internal/* /internal
          respond @internal 404
          reverse_proxy * 172.25.0.100:${PHOENIX_HTTP_PORT:-13000}
        }
        EOF

        # mTLS internal control plane (ADR-007, L7-D). Only loaded
        # when certs are provisioned (run scripts/l7-rotate-proxy-cert.sh).
        # Otherwise Caddy boots with only the public portal site so
        # a fresh install / pre-L7-D deployment keeps working.
        if [ -f /etc/nexguard/l7-certs/internal-server.pem ] \
           && [ -f /etc/nexguard/l7-certs/internal-server.key ] \
           && [ -f /etc/nexguard/l7-certs/internal-ca.pem ]; then
          cat <<EOF >> /etc/caddy/Caddyfile
        :13443 {
          tls /etc/nexguard/l7-certs/internal-server.pem /etc/nexguard/l7-certs/internal-server.key {
            client_auth {
              mode require_and_verify
              trusted_ca_cert_file /etc/nexguard/l7-certs/internal-ca.pem
            }
          }
          reverse_proxy * 172.25.0.100:${PHOENIX_HTTP_PORT:-13000}
        }
        EOF
        fi

        caddy run --config /etc/caddy/Caddyfile
    network_mode: "host"
    deploy:
      <<: *default-deploy

  nexguard:
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # image: binhphuong/nexguard:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - ${WIREGUARD_PORT:-51820}:${WIREGUARD_PORT:-51820}/udp
    env_file:
      # This should contain a list of env vars for configuring NexGuard.
      # See https://nexguard.binhphuong.io.vn/docs/reference/env-vars for more info.
      - ${FZ_INSTALL_DIR:-.}/.env
    volumes:
      # IMPORTANT: Persists WireGuard private key and other data. If
      # /var/nexguard/private_key exists when NexGuard starts, it is
      # used as the WireGuard private. Otherwise, one is generated.
      - ${FZ_INSTALL_DIR:-.}/nexguard:/var/nexguard
    cap_add:
      # Needed for WireGuard and firewall support.
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      # Needed for masquerading and NAT.
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      nexguard-network:
        ipv4_address: 172.25.0.100
        ipv6_address: fcff:3990:3990::99

    deploy:
      <<: *default-deploy

  postgres:
    image: postgres:15
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nexguard}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?err}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-nexguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexguard-network
    deploy:
      <<: *default-deploy
      update_config:
        order: stop-first

# Postgres needs a named volume to prevent perms issues on non-linux platforms
volumes:
  postgres-data:

networks:
  nexguard-network:
    enable_ipv6: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-nexguard
    ipam:
      config:
        - subnet: 172.25.0.0/16
        - subnet: fcff:3990:3990::/64
          gateway: fcff:3990:3990::1
