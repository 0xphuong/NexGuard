# L7 ZTNA — opt-in CoreDNS overlay (ADR-012).
#
# Activate alongside the main prod compose:
#
#   docker compose -f docker-compose.prod.yml \
#                  -f docker-compose.coredns.yml \
#                  -f docker-compose.proxy.yml up -d
#
# CoreDNS sidecar that serves DNS for VPN clients. Resolution order:
#   1. mDNS-style noise (.local / .lan / .home / .internal / .corp)
#      → NXDOMAIN locally, never reaches bind9.
#   2. Declared L7 application hostnames → virtual IP from the hosts
#      file written by `FzHttp.L7.CoreDnsHosts` inside the nexguard
#      container at /etc/nexguard/internal-hosts. Bind mount is
#      SHARED with the nexguard service so both containers see the
#      same file.
#   3. Everything else → forwarded to ${COREDNS_FORWARD_TO} (your
#      internal DNS, which also chains public queries upstream).
#
# The Corefile is heavily cache-tuned (`serve_stale`, `prefetch`,
# bigger NXDOMAIN cache) so a single upstream DNS sees ~85-90%
# fewer queries than the raw client load — and stays smooth even
# during burst.
#
# `network_mode: service:nexguard` joins the nexguard container's
# network namespace so CoreDNS sees the `wg-nexguard` interface and
# can receive queries from VPN clients targeting the gateway's WG
# IP. (The earlier `network_mode: host` design didn't work —
# wg-nexguard lives in the nexguard container's namespace and is
# invisible from the host.)
#
# Port 53 inside the shared namespace is NOT touched by the host's
# systemd-resolved, so the old systemd-resolved-disable dance is no
# longer required.

version: '3.7'

services:
  nexguard:
    volumes:
      # Shared bind mount: nexguard writes /etc/nexguard/internal-hosts,
      # CoreDNS reads it read-only via /etc/nexguard. The host
      # directory is auto-created on first `up`.
      - ${FZ_INSTALL_DIR:-.}/coredns-hosts:/etc/nexguard

  coredns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/Corefile"]
    environment:
      # Primary upstream DNS — handles internal + public queries
      # (typically corporate bind9 at 10.0.235.250 which chains
      # public lookups upstream). CoreDNS `{$VAR}` substitution
      # produces one token, so "1.1.1.1 8.8.8.8" arrives as a broken
      # string — use COREDNS_FORWARD_TO_FALLBACK for an HA pair, or
      # edit `coredns/Corefile` directly for more than two upstreams.
      #
      # Default 1.1.1.1 is safe for fresh deployments that haven't
      # set this yet (public-only). Set in .env to your real
      # internal DNS for L7 + internal zone resolution.
      COREDNS_FORWARD_TO: ${COREDNS_FORWARD_TO:-1.1.1.1}

      # Optional HA fallback — second bind9/recursor used ONLY when
      # the primary fails its health check. Defaults to the primary,
      # so leaving this unset is equivalent to "no failover" (and
      # works fine — the forward plugin tolerates the same upstream
      # listed twice, it just won't have an alternate to fail over
      # to). Set in .env when you have a redundant DNS pair.
      COREDNS_FORWARD_TO_FALLBACK: ${COREDNS_FORWARD_TO_FALLBACK:-${COREDNS_FORWARD_TO:-1.1.1.1}}
    volumes:
      - ${FZ_INSTALL_DIR:-.}/coredns/Corefile:/Corefile:ro
      - ${FZ_INSTALL_DIR:-.}/coredns-hosts:/etc/nexguard:ro
    network_mode: "service:nexguard"
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      nexguard:
        condition: service_started
    restart: unless-stopped
