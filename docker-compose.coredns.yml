# L7 ZTNA — opt-in CoreDNS overlay (ADR-012).
#
# Activate alongside the main prod compose:
#
#   docker compose -f docker-compose.prod.yml \
#                  -f docker-compose.coredns.yml \
#                  -f docker-compose.proxy.yml up -d
#
# CoreDNS sidecar that serves DNS for VPN clients. Resolution order:
#   1. mDNS-style noise (.local / .lan / .home / .internal / .corp)
#      → NXDOMAIN locally, never reaches bind9.
#   2. Declared L7 application hostnames → virtual IP from the hosts
#      file written by `FzHttp.L7.CoreDnsHosts` inside the nexguard
#      container at /etc/nexguard/internal-hosts.
#   3. Everything else → forwarded to the upstream list configured
#      in `/settings/l7` (DNS forward upstreams card). Phoenix writes
#      `/etc/nexguard/Corefile.generated` from the DB; CoreDNS picks
#      it up via the `reload 1s` plugin — no container restart.
#
# The Corefile is heavily cache-tuned (`serve_stale`, `prefetch`,
# bigger NXDOMAIN cache) so a single upstream DNS sees ~85-90%
# fewer queries than the raw client load.
#
# `network_mode: service:nexguard` joins the nexguard container's
# network namespace so CoreDNS sees the `wg-nexguard` interface and
# can receive queries from VPN clients targeting the gateway's WG
# IP. (The earlier `network_mode: host` design didn't work —
# wg-nexguard lives in the nexguard container's namespace and is
# invisible from the host.)
#
# Port 53 inside the shared namespace is NOT touched by the host's
# systemd-resolved, so the old systemd-resolved-disable dance is no
# longer required.

version: '3.7'

services:
  nexguard:
    volumes:
      # Shared bind mount, writable from nexguard:
      #   * /etc/nexguard/internal-hosts      ← CoreDnsHosts writes
      #   * /etc/nexguard/Corefile.generated  ← CoreDnsCorefile writes
      # CoreDNS reads both read-only via the same path.
      - ${FZ_INSTALL_DIR:-.}/coredns-hosts:/etc/nexguard

  # Init sidecar — block coredns until Phoenix has written the
  # initial /etc/nexguard/Corefile.generated. The CoreDNS image is
  # distroless (no /bin/sh) so we can't wrap its own entrypoint in
  # a polling loop. Run a tiny busybox container to do the wait,
  # then exit; compose's `depends_on: service_completed_successfully`
  # gates coredns startup on this completing.
  #
  # In practice Phoenix's bootstrap_dns/0 finishes within ~2-5s of
  # nexguard becoming healthy, so this almost always exits in
  # 1-2 poll cycles. The 60s cap is just defensive — if the file
  # is still missing after that, something else is broken and
  # crashing fast beats silently degraded.
  coredns-init:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        i=0
        while [ ! -f /etc/nexguard/Corefile.generated ]; do
          if [ $$i -ge 120 ]; then
            echo "Corefile.generated still missing after 60s — giving up" >&2
            exit 1
          fi
          [ $$((i % 4)) -eq 0 ] && echo "waiting for /etc/nexguard/Corefile.generated... ($$i/120)"
          i=$$((i+1))
          sleep 0.5
        done
        echo "Corefile.generated ready"
    volumes:
      - ${FZ_INSTALL_DIR:-.}/coredns-hosts:/etc/nexguard:ro
    depends_on:
      nexguard:
        condition: service_started
    restart: "no"

  coredns:
    image: coredns/coredns:1.11.3
    # Phoenix writes the Corefile from DB-backed org_settings;
    # CoreDNS' `reload 2s` plugin picks up edits without container
    # restart. Admins edit upstreams via /settings/l7 in the portal
    # instead of editing .env + recreating.
    command: ["-conf", "/etc/nexguard/Corefile.generated"]
    # Capacity tuning — CoreDNS at ~100 req/s baseline + burst from
    # multi-iOS clients can chew through default file descriptors
    # (1024) when forward connection pooling keeps sockets open.
    # 65K nofile is the standard production ceiling.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ${FZ_INSTALL_DIR:-.}/coredns-hosts:/etc/nexguard:ro
    network_mode: "service:nexguard"
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      nexguard:
        condition: service_started
      coredns-init:
        condition: service_completed_successfully
    restart: unless-stopped
