# L7 ZTNA — opt-in CoreDNS overlay (ADR-012).
#
# Activate alongside the main prod compose:
#
#   docker compose -f docker-compose.prod.yml \
#                  -f docker-compose.coredns.yml \
#                  -f docker-compose.proxy.yml up -d
#
# CoreDNS sidecar that serves DNS for VPN clients. Resolution order:
#   1. Declared L7 application hostnames → virtual IP from the hosts
#      file written by `FzHttp.L7.CoreDnsHosts` inside the nexguard
#      container at /etc/nexguard/internal-hosts. The bind mount is
#      SHARED with the nexguard service so both containers see the
#      same file.
#   2. Everything else → forwarded to ${COREDNS_FORWARD_TO}. Set this
#      in .env to your internal DNS (e.g. 10.0.235.250) so internal
#      non-L7 names AND public queries both keep working — the
#      internal resolver handles internal + forwards public upstream.
#
# `network_mode: service:nexguard` joins the nexguard container's
# network namespace so CoreDNS sees the `wg-nexguard` interface and
# can receive queries from VPN clients targeting the gateway's WG
# IP. (The earlier `network_mode: host` design didn't work —
# wg-nexguard lives in the nexguard container's namespace and is
# invisible from the host.)
#
# Port 53 inside the shared namespace is NOT touched by the host's
# systemd-resolved, so the old systemd-resolved-disable dance is no
# longer required.

version: '3.7'

services:
  nexguard:
    volumes:
      # Shared bind mount: nexguard writes /etc/nexguard/internal-hosts,
      # CoreDNS reads it read-only via /etc/nexguard. The host
      # directory is auto-created on first `up`.
      - ${FZ_INSTALL_DIR:-.}/coredns-hosts:/etc/nexguard

  coredns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/Corefile"]
    environment:
      # Split-horizon resolution — internal zones go to the
      # operator's authoritative resolver; everything else is
      # forwarded to public DNS hardcoded in the Corefile.
      #
      #   COREDNS_INTERNAL_ZONES   — space-separated internal zones,
      #                              e.g. "sevensystem.vn"
      #                              (placeholder default never
      #                              matches a real query)
      #   COREDNS_INTERNAL_FORWARD — single authoritative resolver
      #                              IP, e.g. "10.0.235.250"
      #
      # NOTE: CoreDNS `{$VAR}` substitution produces a single token,
      # so COREDNS_INTERNAL_FORWARD must be ONE server. To use
      # multiple public DNS servers, edit `coredns/Corefile`
      # directly (the forward . line is bind-mounted, no rebuild
      # needed — restart coredns to pick up the change).
      COREDNS_INTERNAL_ZONES:   ${COREDNS_INTERNAL_ZONES:-internal.invalid}
      COREDNS_INTERNAL_FORWARD: ${COREDNS_INTERNAL_FORWARD:-127.0.0.255}
    volumes:
      - ${FZ_INSTALL_DIR:-.}/coredns/Corefile:/Corefile:ro
      - ${FZ_INSTALL_DIR:-.}/coredns-hosts:/etc/nexguard:ro
    network_mode: "service:nexguard"
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      nexguard:
        condition: service_started
    restart: unless-stopped
